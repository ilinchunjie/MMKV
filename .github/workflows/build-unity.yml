name: Build Unity Native Libraries

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # iOS - arm64 Static Library
  # ============================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build iOS arm64
        run: |
          cmake -S Unity -B build-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DMMKV_UNITY_IOS=ON
          cmake --build build-ios --config Release

      - name: Merge static libraries and strip
        run: |
          MMKV_LIB=$(find build-ios -name "libmmkv.a" -path "*/Release*" | head -1)
          CORE_LIB=$(find build-ios -name "libcore.a" -path "*/Release*" | head -1)
          echo "Found mmkv: $MMKV_LIB"
          echo "Found core: $CORE_LIB"
          libtool -static -o libmmkv_merged.a $MMKV_LIB $CORE_LIB
          strip -x libmmkv_merged.a
          ls -lh libmmkv_merged.a

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: libmmkv_merged.a

  # ============================================================
  # Android - arm64-v8a / armeabi-v7a / x86_64 Shared Libraries
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK r28
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Build Android ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S Unity -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --config Release

      - name: Strip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP=$(find $ANDROID_NDK_HOME -name "llvm-strip" | head -1)
          $STRIP --strip-unneeded build-android/libmmkv.so
          ls -lh build-android/libmmkv.so

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build-android/libmmkv.so

  # ============================================================
  # Linux - x86_64 Shared Library
  # ============================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux x86_64
        run: |
          cmake -S Unity -B build-linux \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --config Release

      - name: Strip
        run: |
          strip --strip-unneeded build-linux/libmmkv.so
          ls -lh build-linux/libmmkv.so

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build-linux/libmmkv.so

  # ============================================================
  # macOS - arm64 Shared Library
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build macOS arm64
        run: |
          cmake -S Unity -B build-macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --config Release

      - name: Strip
        run: |
          strip -x build-macos/libmmkv.dylib
          ls -lh build-macos/libmmkv.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build-macos/libmmkv.dylib

  # ============================================================
  # Windows - x86_64 Shared Library
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows x64
        run: |
          cmake -S Unity -B build-windows -A x64
          cmake --build build-windows --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build-windows/Release/mmkv.dll

  # ============================================================
  # Release - Assemble Unity Plugin package and create Release
  # ============================================================
  release:
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-linux, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Unity Plugin package
        run: |
          # Create directory structure following Unity Plugins convention
          mkdir -p package/MMKV/Plugins/iOS
          mkdir -p package/MMKV/Plugins/Android/libs/arm64-v8a
          mkdir -p package/MMKV/Plugins/Android/libs/armeabi-v7a
          mkdir -p package/MMKV/Plugins/Android/libs/x86_64
          mkdir -p package/MMKV/Plugins/Linux/x86_64
          mkdir -p package/MMKV/Plugins/macOS/arm64
          mkdir -p package/MMKV/Plugins/Windows/x86_64

          # Copy MMKV.cs
          cp Unity/MMKV.cs package/MMKV/MMKV.cs

          # Copy platform binaries
          cp artifacts/ios-arm64/libmmkv_merged.a          package/MMKV/Plugins/iOS/libmmkv.a
          cp artifacts/android-arm64-v8a/libmmkv.so        package/MMKV/Plugins/Android/libs/arm64-v8a/libmmkv.so
          cp artifacts/android-armeabi-v7a/libmmkv.so      package/MMKV/Plugins/Android/libs/armeabi-v7a/libmmkv.so
          cp artifacts/android-x86_64/libmmkv.so           package/MMKV/Plugins/Android/libs/x86_64/libmmkv.so
          cp artifacts/linux-x86_64/libmmkv.so             package/MMKV/Plugins/Linux/x86_64/libmmkv.so
          cp artifacts/macos-arm64/libmmkv.dylib            package/MMKV/Plugins/macOS/arm64/mmkv.dylib
          cp artifacts/windows-x86_64/mmkv.dll             package/MMKV/Plugins/Windows/x86_64/mmkv.dll

          # Create zip
          cd package
          zip -r ../mmkv-unity-plugin.zip MMKV/

      - name: Verify package structure
        run: |
          echo "=== Package contents ==="
          unzip -l mmkv-unity-plugin.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mmkv-unity-plugin.zip
